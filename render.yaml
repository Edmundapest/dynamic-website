# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" -> pick the repo. Render reads this file.
#
# The database is NOT defined here: it lives on Neon (free forever).
# Set DATABASE_URL in the Render dashboard to your Neon pooled connection string.
services:
  - type: web
    name: dynamic-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # prompted for / set manually in the dashboard
      - key: NODE_VERSION
        value: "22"
