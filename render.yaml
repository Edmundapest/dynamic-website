# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" -> pick the repo. Render reads this file.
#
# The database is NOT defined here: it lives on Neon (free forever).
# Set DATABASE_URL in the Render dashboard to your Neon pooled connection string.
services:
  - type: web
    name: dynamic-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # prompted for / set manually in the dashboard
      - key: DEEPSEEK_API_KEY
        sync: false # DeepSeek API key for AI enrichment
      - key: TAVILY_API_KEY
        sync: false # optional: Tavily search key (reliable web search)
      - key: POST_PASSWORD
        sync: false # shared password required to post
      - key: SESSION_SECRET
        sync: false # random string used to sign session cookies
      - key: VAPID_PUBLIC_KEY
        sync: false # web-push public key (npx web-push generate-vapid-keys)
      - key: VAPID_PRIVATE_KEY
        sync: false # web-push private key (keep secret)
      - key: VAPID_SUBJECT
        value: "mailto:admin@example.com" # contact for the push service
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false # optional: for AI image generation (free Workers AI)
      - key: CLOUDFLARE_API_TOKEN
        sync: false # optional: Cloudflare API token with Workers AI permission
      - key: WHATSAPP_TOKEN
        sync: false # optional: permanent Meta System User access token
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false # optional: WhatsApp Cloud API phone number ID
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false # optional: webhook verify token (any random string)
      - key: WHATSAPP_APP_SECRET
        sync: false # optional: Meta app secret for webhook signatures
      - key: WHATSAPP_ALLOWED_NUMBERS
        sync: false # optional: comma-separated E.164 senders allowed to post
      - key: WHATSAPP_API_VERSION
        value: "v23.0" # override if Meta deprecates this version
      - key: NODE_VERSION
        value: "22"
