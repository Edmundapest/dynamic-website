# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" -> pick the repo. Render reads this file.
#
# The database is NOT defined here: it lives on Neon (free forever).
# Set DATABASE_URL in the Render dashboard to your Neon pooled connection string.
services:
  - type: web
    name: dynamic-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # prompted for / set manually in the dashboard
      - key: DEEPSEEK_API_KEY
        sync: false # DeepSeek API key for AI enrichment
      - key: POST_PASSWORD
        sync: false # shared password required to post
      - key: SESSION_SECRET
        sync: false # random string used to sign session cookies
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false # optional: for AI image generation (free Workers AI)
      - key: CLOUDFLARE_API_TOKEN
        sync: false # optional: Cloudflare API token with Workers AI permission
      - key: NODE_VERSION
        value: "22"
